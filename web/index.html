<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driftwatch</title>
<script>
(function(){
  try {
    var saved = localStorage.getItem('driftwatch-theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch(e) {}
})();
</script>
<style>
  :root {
    --bg: #f4ecdd;
    --bg-elevated: #fffaf0;
    --text: #2b2318;
    --text-dim: #6b5d47;
    --accent: #1c5f6b;
    --accent2: #a4462f;
    --border: #d8c9a8;
    --shadow: rgba(43,35,24,0.12);
  }
  html[data-theme="dark"] {
    --bg: #0b1420;
    --bg-elevated: #121e2e;
    --text: #dce8ea;
    --text-dim: #7d94a0;
    --accent: #5fd0e0;
    --accent2: #e0a15f;
    --border: #22394a;
    --shadow: rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.5;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .hand {
    font-family: 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive;
  }
  #app { max-width: 860px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
    border-bottom: 2px solid var(--border);
    padding-bottom: 0.75rem;
    margin-bottom: 1.5rem;
  }
  header h1 {
    margin: 0;
    font-size: 2rem;
    letter-spacing: 0.02em;
  }
  header .meta {
    font-size: 0.85rem;
    color: var(--text-dim);
    text-align: right;
  }
  #theme-toggle {
    font-size: 1.1rem;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
    color: var(--text);
  }
  #theme-toggle:hover { border-color: var(--accent); }

  section { margin-bottom: 2.5rem; }
  h2 {
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.3rem;
  }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem 1.25rem;
    box-shadow: 0 2px 6px var(--shadow);
  }
  #latest .card { padding: 1.5rem 1.75rem; }
  #latest h3 { margin: 0 0 0.4rem; font-size: 1.6rem; }
  #latest .body-text { font-size: 1.1rem; margin: 0.75rem 0; }
  .entry-meta {
    font-size: 0.85rem;
    color: var(--text-dim);
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1rem;
  }
  .style-badge {
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 0.5rem;
  }

  #log-list .card { margin-bottom: 0.75rem; }
  #log-list h4 { margin: 0 0 0.3rem; font-size: 1.1rem; }
  #log-list .body-text { margin: 0.4rem 0; }

  #error, .empty {
    color: var(--accent2);
    font-style: italic;
  }

  .lex-tidal { color: #2196a8; }
  .lex-mineral { color: #a58b5a; }
  .lex-avian { color: #c9622f; }
  .lex-mechanical { color: #7a7a8c; }
  .lex-botanical { color: #4f9d4f; }

  #chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 0.5rem;
  }
  #chart-legend .swatch { display: inline-block; width: 0.9em; height: 0.9em; border-radius: 2px; margin-right: 0.3em; vertical-align: -0.1em; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 class="hand">Driftwatch</h1>
    <div class="meta">
      <div id="run-counter">&nbsp;</div>
      <div id="last-ran">&nbsp;</div>
      <button id="theme-toggle" aria-label="Toggle dark mode">&#9788;/&#9789;</button>
    </div>
  </header>

  <div id="error" hidden></div>

  <section id="latest"></section>

  <section id="chart-section">
    <h2 class="hand">Drift</h2>
    <div id="chart"></div>
    <div id="chart-legend"></div>
  </section>

  <section id="log">
    <h2 class="hand">Log</h2>
    <div id="log-list"></div>
  </section>
</div>

<script>
(function(){
  var LEX_COLOR = {
    tidal: '#2196a8', mineral: '#a58b5a', avian: '#c9622f',
    mechanical: '#7a7a8c', botanical: '#4f9d4f'
  };

  function timeAgo(iso) {
    if (!iso) return 'unknown';
    var diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 0) diff = 0;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }

  function fmtWeather(w) {
    if (!w || w.temp_c == null) return 'weather unobserved';
    return w.label + ', ' + w.temp_c + '°C, wind ' + w.wind_kph + ' kph';
  }

  function styleBadge(e) {
    if (!e.style) return '';
    return 'lexicon: <span class="lex-' + e.style.lexicon + '">' + e.style.lexicon + '</span>'
      + ' &middot; sentence_target: ' + e.style.sentence_target
      + ' &middot; austerity: ' + e.style.austerity
      + ' &middot; drift: ' + e.drift;
  }

  function renderLatest(e) {
    var el = document.getElementById('latest');
    if (!e) { el.innerHTML = '<p class="empty">No dispatches yet.</p>'; return; }
    el.innerHTML =
      '<div class="card">' +
        '<h3>' + escapeHtml(e.title || ('Dispatch ' + e.seq)) + '</h3>' +
        '<div class="entry-meta">' +
          '<span>' + new Date(e.sk).toLocaleString() + '</span>' +
          '<span>' + fmtWeather(e.weather) + '</span>' +
        '</div>' +
        '<p class="body-text">' + escapeHtml(e.body || '') + '</p>' +
        '<div class="style-badge">' + styleBadge(e) + '</div>' +
      '</div>';
  }

  function renderLog(entries) {
    var el = document.getElementById('log-list');
    if (!entries.length) { el.innerHTML = '<p class="empty">No earlier dispatches.</p>'; return; }
    el.innerHTML = entries.map(function(e){
      return '<div class="card">' +
        '<h4>' + escapeHtml(e.title || ('Dispatch ' + e.seq)) + '</h4>' +
        '<div class="entry-meta">' +
          '<span>' + new Date(e.sk).toLocaleString() + '</span>' +
          '<span>' + fmtWeather(e.weather) + '</span>' +
        '</div>' +
        '<p class="body-text">' + escapeHtml(e.body || '') + '</p>' +
        '<div class="style-badge">' + styleBadge(e) + '</div>' +
      '</div>';
    }).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function renderChart(series) {
    var el = document.getElementById('chart');
    var legend = document.getElementById('chart-legend');
    if (!series || !series.length) { el.innerHTML = '<p class="empty">Not enough runs yet to chart drift.</p>'; legend.innerHTML=''; return; }

    var W = 800, H = 320;
    var padL = 50, padR = 20, padT = 20, padB = 60;
    var x0 = padL, x1 = W - padR, y0 = H - padB, y1 = padT;

    var seqs = series.map(function(s){ return s.seq; });
    var minSeq = Math.min.apply(null, seqs), maxSeq = Math.max.apply(null, seqs);
    var span = (maxSeq - minSeq) || 1;

    function xScale(seq) { return x0 + (seq - minSeq) / span * (x1 - x0); }
    function yScale(v) { return y0 - Math.max(0, Math.min(1, v)) * (y0 - y1); }

    function norm(s) { return Math.max(0, Math.min(1, (s.sentence_target - 6) / 18)); }

    var stPts = series.map(function(s){ return xScale(s.seq) + ',' + yScale(norm(s)); }).join(' ');
    var auPts = series.map(function(s){ return xScale(s.seq) + ',' + yScale(s.austerity); }).join(' ');

    var lexMarkers = '';
    var prevLex = null;
    series.forEach(function(s){
      if (s.lexicon !== prevLex) {
        var cx = xScale(s.seq);
        var color = LEX_COLOR[s.lexicon] || '#888';
        lexMarkers += '<line x1="' + cx + '" y1="' + y0 + '" x2="' + cx + '" y2="' + (y0 + 12) +
          '" stroke="' + color + '" stroke-width="2" stroke-linecap="round"><title>seq ' + s.seq + ': ' + s.lexicon + '</title></line>';
        lexMarkers += '<circle cx="' + cx + '" cy="' + (y0 + 12) + '" r="3.5" fill="' + color + '"><title>seq ' + s.seq + ': ' + s.lexicon + '</title></circle>';
        prevLex = s.lexicon;
      }
    });

    var gridlines = [0, 0.5, 1].map(function(v){
      var y = yScale(v);
      return '<line class="wobble" x1="' + x0 + '" y1="' + y + '" x2="' + x1 + '" y2="' + y +
        '" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,4"/>' +
        '<text x="' + (x0 - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="var(--text-dim)">' + v + '</text>';
    }).join('');

    var xLabels = '<text x="' + x0 + '" y="' + (y0 + 34) + '" font-size="11" fill="var(--text-dim)">seq ' + minSeq + '</text>' +
      '<text x="' + x1 + '" y="' + (y0 + 34) + '" text-anchor="end" font-size="11" fill="var(--text-dim)">seq ' + maxSeq + '</text>';

    el.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Drift chart">' +
        '<defs>' +
          '<filter id="rough" x="-5%" y="-5%" width="110%" height="110%">' +
            '<feTurbulence type="fractalNoise" baseFrequency="0.01 0.04" numOctaves="2" seed="7" result="noise"/>' +
            '<feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>' +
          '</filter>' +
        '</defs>' +
        gridlines +
        '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x1 + '" y2="' + y0 + '" stroke="var(--text-dim)" stroke-width="1.5" filter="url(#rough)"/>' +
        '<polyline points="' + stPts + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#rough)"/>' +
        '<polyline points="' + auPts + '" fill="none" stroke="var(--accent2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#rough)"/>' +
        lexMarkers +
        xLabels +
      '</svg>';

    legend.innerHTML =
      '<span><span class="swatch" style="background:var(--accent)"></span>sentence_target (normalized)</span>' +
      '<span><span class="swatch" style="background:var(--accent2)"></span>austerity</span>' +
      Object.keys(LEX_COLOR).map(function(k){
        return '<span><span class="swatch" style="background:' + LEX_COLOR[k] + '"></span>' + k + '</span>';
      }).join('');
  }

  function renderMeta(feed) {
    document.getElementById('run-counter').textContent = 'Runs: ' + (feed.count != null ? feed.count : '?');
    document.getElementById('last-ran').textContent = 'Last ran ' + timeAgo(feed.generated_at);
  }

  function showError(msg) {
    var el = document.getElementById('error');
    el.hidden = false;
    el.textContent = msg;
  }

  function render(feed) {
    var entries = (feed.entries || []).filter(function(e){ return !e.stub; });
    renderLatest(entries[0]);
    renderLog(entries.slice(1));
    renderChart(feed.series || []);
    renderMeta(feed);
  }

  function init() {
    var toggle = document.getElementById('theme-toggle');
    toggle.addEventListener('click', function(){
      var cur = document.documentElement.getAttribute('data-theme');
      var next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('driftwatch-theme', next); } catch(e) {}
    });

    fetch('feed.json', { cache: 'no-store' })
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(render)
      .catch(function(err){
        showError('Could not load feed.json (' + err.message + '). Driftwatch may not have run yet, or this page was opened somewhere feed.json is not reachable.');
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
